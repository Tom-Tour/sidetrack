<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidetrack</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 16px system-ui, sans-serif; }
    #player { width: 100%; height: 100%; }
    #unlock {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.85);
    }
    #unlock[hidden] { display: none; }
    #unlock button {
      font: inherit; font-size: 20px; padding: 16px 28px; cursor: pointer;
      color: #fff; background: #0061e0; border: 0; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="unlock" hidden><button>🔊 Activer le son</button></div>
  <script src="player.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
