<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidetrack</title>
  <!-- Versions à incrémenter à chaque modification (cache de GitHub Pages) -->
  <link rel="stylesheet" href="join.css?v=5">
</head>
<body>
  <nav id="langs"><button data-lang="fr">FR</button> · <button data-lang="en">EN</button></nav>

  <main id="login">
    <h1>Sidetrack</h1>
    <p class="muted" data-i18n="intro"></p>
    <form id="login-form">
      <label><span data-i18n="codeLabel"></span> <input id="code" type="text" maxlength="24" autocomplete="off" required></label>
      <label><span data-i18n="nameLabel"></span> <input id="name" type="text" maxlength="24" autocomplete="nickname" required></label>
      <button type="submit" data-i18n="joinButton"></button>
      <progress id="pow-progress" max="1" value="0" hidden></progress>
    </form>
    <p id="login-error" class="error" hidden></p>
    <p class="muted small" data-i18n="ipNotice"></p>
  </main>

  <main id="room" hidden>
    <header>
      <strong><span data-i18n="room"></span> <span id="room-code"></span></strong>
      <span id="room-status" class="muted"></span>
      <label class="volume" data-i18n-title="volume">🔊 <input type="range" id="volume" min="0" max="100" value="100"></label>
    </header>

    <div id="layout">
      <section id="stage">
        <div id="player-wrap">
          <div id="player"></div>
          <div id="mask" hidden>
            <div id="mask-icon">?</div>
            <div id="mask-time"></div>
          </div>
        </div>
        <div id="now"></div>
        <div id="blind-status" hidden></div>
        <button id="share-moment" data-i18n="shareMoment" data-i18n-title="shareMomentHelp"></button>
        <section id="playlist">
          <h2><span data-i18n="hostPlaylist"></span> <span class="muted" data-i18n="hostPlaylistHelp"></span></h2>
          <ol id="queue"></ol>
        </section>
      </section>

      <aside id="side">
        <ul id="players"></ul>
        <div id="chat"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" data-i18n-placeholder="chatPlaceholder" autocomplete="off" maxlength="300">
          <button type="submit" data-i18n="send"></button>
        </form>
        <p id="chat-note" class="muted small" hidden></p>
      </aside>
    </div>
  </main>

  <script src="../vendor/peerjs.min.js"></script>
  <script src="../vendor/nostr.bundle.js"></script>
  <script src="join.js?v=9"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
