<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="pl-bar">
    <select id="pl-select" title="Playlist"></select>
    <input id="pl-name" type="text" placeholder="Nom de la playlist" autocomplete="off" hidden>
    <button id="pl-new" title="Nouvelle playlist">＋</button>
    <button id="pl-rename" title="Renommer">✎</button>
    <button id="pl-delete" title="Supprimer la playlist">🗑</button>
    <button id="pl-export" title="Exporter vers YouTube">⤴</button>
  </div>
  <p id="notice" hidden></p>

  <form id="add">
    <input id="url" type="text" placeholder="Lien YouTube (vidéo ou playlist)" autocomplete="off">
    <button type="submit">Ajouter</button>
  </form>

  <section id="room">
    <button id="room-open">👥 Créer un salon</button>
    <div id="room-panel" hidden>
      <div id="room-head">
        <span>Salon <strong id="room-code"></strong></span>
        <span id="room-status" class="muted"></span>
        <button id="room-copy" title="Copier le lien d'invitation">🔗 Copier le lien</button>
        <button id="room-close" title="Fermer le salon">✕</button>
      </div>
      <ul id="room-players"></ul>
      <div id="chat"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Message au salon" autocomplete="off" maxlength="300">
        <button type="submit">Envoyer</button>
      </form>
    </div>
  </section>

  <div id="tabs">
    <button id="mode-listen" class="tab">🎧 Écoute</button>
    <button id="mode-blind" class="tab">❓ Blind test</button>
  </div>

  <div id="player-wrap">
    <img id="art" alt="" hidden>
    <div id="mask" hidden>
      <div id="mask-icon">?</div>
      <div id="mask-time"></div>
    </div>
  </div>
  <div id="now">Rien en lecture</div>
  <div id="volume-row">
    <label title="Volume">🔊 <input type="range" id="volume" min="0" max="100"></label>
    <button id="show-player" title="Afficher / masquer l'onglet de la vidéo">📺</button>
  </div>

  <section id="listen">
    <div class="controls">
      <button id="prev" title="Précédent">⏮</button>
      <button id="toggle" title="Lecture / pause">⏯</button>
      <button id="next" title="Suivant">⏭</button>
      <button id="shuffle" title="Aléatoire">🔀</button>
    </div>
    <ol id="queue"></ol>
    <p id="empty" class="muted" hidden>Playlist vide : colle un lien YouTube ci-dessus.</p>
  </section>

  <section id="blind" hidden>
    <div id="blind-status"></div>
    <div id="blind-actions" class="controls"></div>
    <fieldset id="blind-settings">
      <label>Durée de l'extrait
        <select id="clip">
          <option value="10">10 s</option>
          <option value="15">15 s</option>
          <option value="20">20 s</option>
          <option value="30">30 s</option>
          <option value="0">Morceau entier</option>
          <option value="-1">Durée du chapitre</option>
        </select>
      </label>
      <label>Départ
        <select id="startMode">
          <option value="start">Début du morceau</option>
          <option value="random">Moment aléatoire</option>
          <option value="chapter">Chapitre aléatoire</option>
        </select>
      </label>
      <label><input type="checkbox" id="hideVideo"> Masquer la vidéo</label>
    </fieldset>
  </section>

  <details>
    <summary>Journal</summary>
    <pre id="log"></pre>
  </details>

  <script src="sidebar.js"></script>
</body>
</html>
